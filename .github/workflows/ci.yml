# Ci CI workflow.
#
# Supply-chain hardening: every third-party action is pinned to a full commit
# SHA rather than a mutable tag or branch. A tag such as `v4` (or a branch such
# as `stable`) can be repointed at different code by the action's maintainers —
# or by anyone who compromises their account — with no corresponding change in
# this repository, so an already-reviewed workflow could start running
# unreviewed code. The trailing comment records the human-readable version the
# SHA was resolved from; Dependabot's `github-actions` ecosystem (configured in
# .github/dependabot.yml) raises a PR that updates both the SHA and the comment
# together.
#
# Naming a pinned step once would be ideal, but GitHub Actions has no way to
# alias a `uses:` target across jobs, so each occurrence is pinned in place.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32v1-none
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: contracts

      # Lint gate for the contracts, alongside the frontend/sdk/cli
      # lint steps (#76). Clippy is not gated yet: it currently flags the
      # deprecated events().publish API, whose #[contractevent] replacement
      # changes on-chain event encoding and needs its own change.
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo build --workspace --target wasm32v1-none --release

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Fail the build on high/critical advisories in production (and optional)
      # dependencies. Dev-only tooling is excluded to keep this focused on the
      # code that actually ships to users.
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      # cli depends on sdk via a local file: reference, so sdk needs a
      # real dist/ on disk before `npm ci` in cli resolves it.
      - run: npm ci && npm run build
        working-directory: sdk

      - run: npm ci
        working-directory: cli
      - run: npm run lint
        working-directory: cli
      - run: npm run typecheck
        working-directory: cli
      - run: npm run test
        working-directory: cli
      - run: npm run build
        working-directory: cli